<div class="chat-panel">
    <div class="panel-header">
        <h2 class="panel-title">Desglose de Gastos de Texto/Tabla</h2>
        <div class="action-buttons">
            <button class="action-btn" (click)="regenerateLastMessage()" [disabled]="messages.length <= 1"
                title="Regenerar última respuesta">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2">
                    <polyline points="23 4 23 10 17 10"></polyline>
                    <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                </svg>
                Regenerar
            </button>
            <button class="action-btn" (click)="exportChat()" [disabled]="messages.length <= 1"
                title="Exportar conversación">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                Exportar
            </button>
            <button class="action-btn" (click)="toggleExamples()" title="Ver ejemplos de preguntas">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="16" x2="12" y2="12"></line>
                    <line x1="12" y1="8" x2="12.01" y2="8"></line>
                </svg>
                Ejemplos
            </button>
            <button class="action-btn btn-clear" (click)="confirmClearChat()" title="Limpiar conversación">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                </svg>
                Limpiar
            </button>
        </div>
    </div>

    <!-- Panel de ejemplos -->
    <div class="examples-panel" *ngIf="showExamples">
        <div class="examples-header">
            <h3>Ejemplos de preguntas</h3>
            <button class="close-btn" (click)="toggleExamples()">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
        <div class="examples-list">
            <div class="example-item" *ngFor="let example of exampleQuestions" (click)="useExample(example)">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                <span>{{ example }}</span>
            </div>
        </div>
    </div>

    <div class="messages-container" #messagesContainer>
        <div *ngFor="let message of messages" class="message-wrapper">
            <div class="avatar" [class.ai]="message.type === 'ai'">
                {{ message.type === 'ai' ? 'AI' : 'U' }}
            </div>
            <div class="message-bubble">
                <p>{{ message.text }}</p>
                <span class="message-time">{{ message.timestamp | date:'short' }}</span>
            </div>
        </div>
    </div>

    <div class="input-section">
        <label class="input-label">Escribe tu consulta aquí:</label>
        <div class="input-wrapper">
            <input type="text" [(ngModel)]="inputText" (keyup.enter)="sendMessage()"
                placeholder="Ejemplo: ¿Cuánto gastamos en BONO CLIENTE en octubre?" class="text-input" />
            <button (click)="sendMessage()" class="send-btn" [disabled]="!inputText.trim()">
                Enviar
            </button>
        </div>
    </div>
</div>

<!-- Modal de confirmación mejorado -->
<div class="modal-overlay" *ngIf="showClearConfirm" (click)="cancelClear()">
    <div class="modal-content" (click)="$event.stopPropagation()">
        <div class="modal-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2">
                <path d="M3 6h18"></path>
                <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
                <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
                <line x1="10" y1="11" x2="10" y2="17"></line>
                <line x1="14" y1="11" x2="14" y2="17"></line>
            </svg>
        </div>
        <h3 class="modal-title">¿Limpiar conversación?</h3>
        <p class="modal-message">Esta acción eliminará todo el historial del chat. No se puede deshacer.</p>
        <div class="modal-actions">
            <button class="modal-btn btn-cancel" (click)="cancelClear()">
                Cancelar
            </button>
            <button class="modal-btn btn-confirm" (click)="clearChat()">
                Limpiar
            </button>
        </div>
    </div>
</div>

<!-- Notificación mejorada -->
<div class="notification" *ngIf="showNotification">
    <div class="notification-content">
        <svg class="notification-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        <span>{{ notificationMessage }}</span>
    </div>
</div>
